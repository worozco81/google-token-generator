<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Tokens Google Calendar</title>
    <style>
        body { font-family: system-ui; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #1a73e8; }
        table { width: 100%; background: white; border-radius: 12px; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        button { background: #1a73e8; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .token { font-family: monospace; font-size: 11px; word-break: break-all; max-width: 300px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 24px; border-radius: 12px; max-width: 500px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Clientes Conectados</h1>
        <button onclick="loadClients()">🔄 Actualizar</button>
        <table>
            <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Estado</th><th>Refresh Token</th><th>Acciones</th></tr></thead>
            <tbody id="clients"></tbody>
        </table>
    </div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Refresh Token</h3>
            <code id="tokenValue" style="display:block;background:#f4f4f4;padding:10px;margin:10px 0;"></code>
            <button onclick="copyToken()">Copiar</button>
            <button onclick="closeModal()">Cerrar</button>
        </div>
    </div>
    <script>
        const apiKey = new URLSearchParams(location.search).get('api_key');
        async function loadClients() {
            const res = await fetch('/api/clients?api_key=' + apiKey);
            const clients = await res.json();
            const tbody = document.getElementById('clients');
            tbody.innerHTML = '';
            clients.forEach(c => {
                tbody.innerHTML += `<tr>
                    <td>${c.id}</td>
                    <td>${c.name || '-'}</td>
                    <td>${c.email || '-'}</td>
                    <td>${c.has_token ? '✅ Conectado' : '⏳ Pendiente'}</td>
                    <td class="token">${c.has_token ? '••••••••' : '-'}</td>
                    <td>${c.has_token ? `<button onclick="getToken('${c.id}')">Ver Token</button>` : `<button onclick="generateLink('${c.id}','${c.name || ''}','${c.email || ''}')">Generar Link</button>`}</td>
                </tr>`;
            });
        }
        async function getToken(id) {
            const res = await fetch('/api/token/' + id + '?api_key=' + apiKey);
            const data = await res.json();
            document.getElementById('tokenValue').innerText = data.refresh_token;
            document.getElementById('modal').style.display = 'flex';
        }
        function copyToken() { navigator.clipboard.writeText(document.getElementById('tokenValue').innerText); alert('Copiado'); }
        function generateLink(id,name,email) { prompt('Link para el cliente:', location.origin + '/connect/' + id + '?name=' + encodeURIComponent(name) + '&email=' + encodeURIComponent(email)); }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        loadClients();
    </script>
</body>
</html>
